name: RANK 0 DEMONIC DEEP COMPILE - SOVEREIGN MATRIX V2.x

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Force limit-breaker clean compilation'
        required: true
        default: 'true'

env:
  BASE_APK_VER: "21.04.222"

jobs:
  sovereign_compilation:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Workspace Initialization
        uses: actions/checkout@v4

      - name: 2. JVM Environment Provisioning (Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: 3. Dynamic API Extraction (Unkillable Fetcher V2)
        run: |
          mkdir -p workspace && cd workspace
          sudo apt-get update && sudo apt-get install -y jq curl wget
          
          echo "Extracting Latest CLI Engine..."
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest | jq -r '.assets[] | select(.name | test("morphe-cli-.*-all\\.jar")) | .browser_download_url')
          wget -q -O morphe-cli.jar "$CLI_URL"
          
          echo "Extracting Latest Patch Matrix..."
          PATCHES_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | jq -r '.assets[] | select(.name | test(".*\\.mpp$")) | .browser_download_url')
          wget -q -O patches.mpp "$PATCHES_URL"
          
          echo "Extracting Sovereign Integrations (V2.x Requirement)..."
          INTEGRATIONS_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-integrations/releases/latest | jq -r '.assets[] | select(.name | test(".*\\.apk$")) | .browser_download_url')
          wget -q -O integrations.apk "$INTEGRATIONS_URL"
          
      - name: 4. The Absolute Substrate Fetch (Direct Cloudflare-Resistant Nodes)
        run: |
          cd workspace
          echo "Engaging Direct API stream for v21.04.222..."
          
          # Primary Mirror (DriftyWinds/YT-Builds)
          curl -L -o target-base.apk "https://github.com/driftywinds/YT-builds/releases/download/v21.04.222/youtube-21.04.222-nodpi.apk"
          
          APK_SIZE=$(stat -c%s "target-base.apk" 2>/dev/null || echo 0)
          echo "Substrate Verification Core: Size is $APK_SIZE bytes."
          if [ "$APK_SIZE" -lt 15000000 ]; then
             echo "Primary Node Failed. Engaging Secondary Mirror (RookieEnough)..."
             curl -L -o target-base.apk "https://github.com/RookieEnough/Morphe-AutoBuilds/releases/download/v3.4.0/youtube-universal-morphe-patches-v21.04.222.apk"
          fi
          
          APK_SIZE_FINAL=$(stat -c%s "target-base.apk" 2>/dev/null || echo 0)
          if [ "$APK_SIZE_FINAL" -lt 15000000 ]; then
            echo "::error::Substrate extraction completely failed. Matrix blocked the stream."
            exit 1
          fi

      - name: 5. Options.json AST Schema Generation (V5+)
        run: |
          cd workspace
          cat << 'EOF' > sovereign-options.json
          [
            {
              "patch": "Theme",
              "options": {
                "background_color": "@android:color/black",
                "promoted_color": "@android:color/black",
                "header_color": "@android:color/black"
              }
            },
            {
              "patch": "Custom branding name",
              "options": {
                "appName": "YouTube Sovereign"
              }
            },
            {
              "patch": "Swipe controls",
              "options": {
                "enable_volume_gesture": true,
                "enable_brightness_gesture": true
              }
            },
            {
              "patch": "SponsorBlock",
              "options": {
                "video_sponsor_segments": [
                  "sponsor",
                  "intro",
                  "outro",
                  "selfpromo",
                  "interaction"
                ]
              }
            }
          ]
          EOF

      - name: 6. Ephemeral Keystore Cryptographic Generation
        run: |
          cd workspace
          keytool -genkey -v -keystore morphe.keystore -alias morphe -keyalg RSA -keysize 2048 -validity 10000 -storepass morphe_secure -keypass morphe_secure -dname "CN=Sovereign, OU=Shadow, O=Kaiser, L=WestBengal, S=India, C=IN"

      - name: 7. Execute Demonic Compile (God Mode Override)
        run: |
          cd workspace
          java -Xmx4G -XX:+UseZGC \
            -jar morphe-cli.jar patch \
            --patches patches.mpp \
            --merge integrations.apk \
            --options-file sovereign-options.json \
            --keystore-entry-alias="morphe" \
            --keystore-password="morphe_secure" \
            --keystore-entry-password="morphe_secure" \
            --keystore="morphe.keystore" \
            --exclusive "Optimization Tweaks" \
            --out YouTube_Kaiser_Sovereign.apk \
            target-base.apk

      - name: 8. Upload Sovereign Target Asset
        uses: actions/upload-artifact@v4
        with:
          name: Sovereign-Rank0-Matrix-V2.x
          path: workspace/YouTube_Kaiser_Sovereign.apk

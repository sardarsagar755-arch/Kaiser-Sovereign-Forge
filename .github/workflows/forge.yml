name: RANK 0 DEMONIC DEEP COMPILE - SOVEREIGN MATRIX

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Force limit-breaker clean compilation'
        required: true
        default: 'true'

jobs:
  sovereign_compilation:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Workspace Initialization
        uses: actions/checkout@v4

      - name: 2. JVM Environment Provisioning (Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: 3. The Shadow Scraper (API-Bypass Core)
        run: |
          mkdir -p workspace && cd workspace
          sudo apt-get update && sudo apt-get install -y curl wget grep unzip
          
          echo "Slicing through Corporate API Limits..."
          CLI_URI=$(curl -sL https://github.com/ReVanced/revanced-cli/releases/latest | grep -oE '/ReVanced/revanced-cli/releases/download/[^"]+\.jar' | head -n 1)
          wget -q -O morphe-cli.jar "https://github.com$CLI_URI" || true
          
          PATCH_URI=$(curl -sL https://github.com/ReVanced/revanced-patches/releases/latest | grep -oE '/ReVanced/revanced-patches/releases/download/[^"]+\.rvp|/ReVanced/revanced-patches/releases/download/[^"]+\.jar' | head -n 1)
          wget -q -O patches.mpp "https://github.com$PATCH_URI" || true
          
          INT_URI=$(curl -sL https://github.com/ReVanced/revanced-integrations/releases/latest | grep -oE '/ReVanced/revanced-integrations/releases/download/[^"]+\.apk' | head -n 1)
          wget -q -O integrations.apk "https://github.com$INT_URI" || true

      - name: 4. The Absolute Substrate Fetch (Rust Cyber-Scraper)
        run: |
          cd workspace
          echo "Matrix DMCA Blockade detected on GitHub. Engaging Rust-based Cyber-Scraper..."
          
          # Downloading 'apkeep' (EFF's unblockable extractor)
          wget -qO apkeep "https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-musl"
          chmod +x apkeep
          
          echo "Tunneling into APKPure Mainframe for v21.04.222..."
          ./apkeep -a com.google.android.youtube@21.04.222 -d apkpure . || true
          
          APK_FILE=$(ls com.google.android.youtube*.apk 2>/dev/null | head -n 1)
          XAPK_FILE=$(ls com.google.android.youtube*.xapk 2>/dev/null | head -n 1)
          
          # Failsafe: If 21.04.222 is fully purged, fallback to the immortal LTS build 19.16.39
          if [ -z "$APK_FILE" ] && [ -z "$XAPK_FILE" ]; then
            echo "Primary target missing. Engaging LTS Fallback (v19.16.39)..."
            ./apkeep -a com.google.android.youtube@19.16.39 -d apkpure . || true
            APK_FILE=$(ls com.google.android.youtube*.apk 2>/dev/null | head -n 1)
            XAPK_FILE=$(ls com.google.android.youtube*.xapk 2>/dev/null | head -n 1)
          fi
          
          # Absolute XAPK Decoder: Extracts only the massive base APK and ignores tiny split configs
          if [ -n "$XAPK_FILE" ]; then
             echo "Encrypted XAPK package detected. Extracting raw Dalvik base..."
             unzip -q "$XAPK_FILE" -d extracted_xapk
             find extracted_xapk -type f -name "*.apk" -size +20M -exec mv {} target-base.apk \;
          elif [ -n "$APK_FILE" ]; then
             mv "$APK_FILE" target-base.apk
          fi
          
          APK_SIZE=$(stat -c%s "target-base.apk" 2>/dev/null || echo 0)
          if [ "$APK_SIZE" -lt 15000000 ]; then
            echo "::error::APKPure Tunnel Blocked. Size: $APK_SIZE bytes."
            exit 1
          fi
          echo "Substrate Secured & Verified! Size: $APK_SIZE bytes."

      - name: 5. Options.json AST Schema Generation (V5+)
        run: |
          cd workspace
          cat << 'EOF' > sovereign-options.json
          [
            {
              "patch": "Theme",
              "options": {
                "background_color": "@android:color/black",
                "promoted_color": "@android:color/black",
                "header_color": "@android:color/black"
              }
            },
            {
              "patch": "Custom branding name",
              "options": {
                "appName": "YouTube Sovereign"
              }
            },
            {
              "patch": "Swipe controls",
              "options": {
                "enable_volume_gesture": true,
                "enable_brightness_gesture": true
              }
            },
            {
              "patch": "SponsorBlock",
              "options": {
                "video_sponsor_segments": [
                  "sponsor",
                  "intro",
                  "outro",
                  "selfpromo",
                  "interaction"
                ]
              }
            }
          ]
          EOF

      - name: 6. Ephemeral Keystore Cryptographic Generation
        run: |
          cd workspace
          keytool -genkey -v -keystore morphe.keystore -alias morphe -keyalg RSA -keysize 2048 -validity 10000 -storepass morphe_secure -keypass morphe_secure -dname "CN=Sovereign, OU=Shadow, O=Kaiser, L=WestBengal, S=India, C=IN"

      - name: 7. Execute Demonic Compile (God Mode Override)
        run: |
          cd workspace
          # The --experimental flag forces the engine to bypass any rigid version locks
          java -Xmx4G -XX:+UseZGC \
            -jar morphe-cli.jar patch \
            target-base.apk \
            --patches patches.mpp \
            --merge integrations.apk \
            --options sovereign-options.json \
            --keystore morphe.keystore \
            --keystore-entry-alias morphe \
            --keystore-password morphe_secure \
            --keystore-entry-password morphe_secure \
            --experimental \
            --out YouTube_Kaiser_Sovereign.apk

      - name: 8. Upload Sovereign Target Asset
        uses: actions/upload-artifact@v4
        with:
          name: Sovereign-Rank0-Matrix-Final
          path: workspace/YouTube_Kaiser_Sovereign.apk

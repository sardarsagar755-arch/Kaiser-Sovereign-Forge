name: RANK 0 DEMONIC DEEP COMPILE - SOVEREIGN MATRIX

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Force limit-breaker clean compilation'
        required: true
        default: 'true'

jobs:
  sovereign_compilation:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Workspace Initialization
        uses: actions/checkout@v4

      - name: 2. JVM Environment Provisioning (Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: 3. Dynamic API Extraction (Unkillable Fetcher)
        run: |
          mkdir -p workspace && cd workspace
          sudo apt-get update && sudo apt-get install -y jq curl wget
          
          echo "Extracting Latest CLI Engine..."
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest | jq -r '.assets[] | select(.name | test("morphe-cli-.*-all\\.jar")) | .browser_download_url')
          wget -q -O morphe-cli.jar "$CLI_URL"
          
          echo "Extracting Latest Patch Matrix..."
          PATCHES_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest | jq -r '.assets[] | select(.name | test(".*\\.mpp$")) | .browser_download_url')
          wget -q -O patches.mpp "$PATCHES_URL"
          
      - name: 4. Substrate Synchronization & Verification
        run: |
          cd workspace
          echo "Engaging Primary Mirror for Target Base..."
          curl -L -o target-base.apk "https://archive.org/download/com.google.android.youtube_20.51.39/com.google.android.youtube_20.51.39.apk"
          
          # The Absolute Trap Checker: Verifying if matrix injected a 0-byte file
          APK_SIZE=$(stat -c%s "target-base.apk" 2>/dev/null || echo 0)
          if [ "$APK_SIZE" -lt 15000000 ]; then
            echo "::error::THE MATRIX TRAP DETECTED: Base APK download failed or is corrupt! Size: $APK_SIZE bytes."
            exit 1
          fi
          echo "Substrate Verification Passed. Size: $APK_SIZE bytes."

      - name: 5. Execute Demonic Compile (Raw Dalvik Injection)
        run: |
          cd workspace
          # Purged all fragile JSON parsers and artificial keystore limits.
          # Forcing the engine to utilize pure native Dalvik execution and auto-signing.
          java -Xmx4G -XX:+UseZGC \
            -jar morphe-cli.jar patch \
            target-base.apk \
            --patches patches.mpp \
            --out YouTube_Kaiser_Sovereign.apk

      - name: 6. Upload Sovereign Target Asset
        uses: actions/upload-artifact@v4
        with:
          name: Sovereign-Rank0-Matrix
          path: workspace/YouTube_Kaiser_Sovereign.apk
          
